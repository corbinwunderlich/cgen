[package]
name = "cgen"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
clang = "2.1.0"
clap = { version = "4.6.6", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
indoc = "2.0.7"
miette = { version = "7.6.0", features = ["fancy"] }
notify = "8.2.0"
noyalib = { version = "0.0.28", default-features = false }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smart-default = "0.7.1"
thiserror = "2.0.20"
toml = "1.1.4"
twox-hash = "2.1.4"
walkdir = "2.5.0"

[dev-dependencies]
serde_json = "1.0.151"

[build-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"
clap-verbosity-flag = "3.0.4"
