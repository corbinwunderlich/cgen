[package]
name = "cgen"
version = "0.1.0"
edition = "2024"
description = "A C/C++ header generator built in Rust"
readme = "README.md"
homepage = "https://github.com/corbinwunderlich/cgen"
repository = "https://github.com/corbinwunderlich/cgen"
license-file = "LICENSE"

[workspace]
members = ["xtask"]

[dependencies]
clang = "2.1.0"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
indoc = "2.0.7"
miette = { version = "7.6.0", features = ["fancy-no-backtrace"] }
notify = { version = "8.2.0", default-features = false }
noyalib = { version = "0.0.28", default-features = false }
schemars = { version = "1.2.2", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smart-default = "0.7.1"
thiserror = "2.0.20"
toml = { version = "1.1.4", default-features = false, features = [
  "parse",
  "serde",
] }
twox-hash = { version = "2.1.4", default-features = false, features = [
  "xxhash3_128",
] }

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "deny", priority = -1 }
